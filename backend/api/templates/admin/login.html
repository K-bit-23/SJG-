{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block extrastyle %}{{ block.super }}
<style>
    body {
        margin: 0;
        display: flex !important;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        background: #020617 radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.1), transparent 70%) !important;
    }
    #content { margin: 0 !important; width: 100% !important; padding: 0 !important; }
    .login #header, .login #branding, .login #user-tools, .login .breadcrumbs { display: none !important; }
    .login #container { background: transparent !important; width: 100% !important; border: none !important; }
    #content-main { margin: 0 auto !important; width: 400px !important; }
    
    .login .module {
        background: rgba(15, 23, 42, 0.8) !important;
        backdrop-filter: blur(20px) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 40px !important;
        padding: 40px !important;
        box-shadow: 0 50px 100px rgba(0,0,0,0.5) !important;
    }

    .login .form-row { border: none !important; padding: 15px 0 !important; }
    .login label { color: #94a3b8 !important; font-size: 11px !important; text-transform: uppercase !important; font-weight: 900 !important; letter-spacing: 2px !important; margin-bottom: 10px !important; display: block !important; }
    .login .submit-row { padding: 30px 0 0 0 !important; text-align: center !important; }
    .login .submit-row input { width: 100% !important; height: 60px !important; font-size: 14px !important; letter-spacing: 4px !important; box-shadow: 0 20px 40px rgba(79, 70, 229, 0.3) !important; cursor: pointer !important; }
    
    .login-logo { text-align: center; margin-bottom: 40px; }
    .login-logo h1 { font-size: 40px; font-weight: 900; letter-spacing: -2px; color: white; margin: 0; }
    .login-logo span { color: #6366f1; font-style: italic; }
</style>
{% endblock %}

{% block content %}
<div class="login-logo">
    <h1>SJG <span>CORE</span></h1>
    <p style="color: #64748b; font-size: 10px; font-weight: 900; letter-spacing: 4px; margin-top: 10px; text-transform: uppercase;">Nexus Authentication</p>
</div>
{{ block.super }}
{% endblock %}
