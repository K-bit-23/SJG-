<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#007bff" stroke="#0056b3" stroke-width="2"/>

  <!-- SJG Text -->
  <text x="50" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">SJG</text>

  <!-- Stationery icon (simplified pen) -->
  <g transform="translate(35, 45)">
    <!-- Pen body -->
    <rect x="0" y="0" width="30" height="8" rx="4" fill="#ffffff"/>
    <!-- Pen tip -->
    <polygon points="30,2 35,4 30,6" fill="#ffffff"/>
  </g>

  <!-- Small decorative elements -->
  <circle cx="25" cy="25" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="75" cy="25" r="3" fill="#ffffff" opacity="0.7"/>
</svg>